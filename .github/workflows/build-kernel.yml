name: Android Kernel Build

on:
  workflow_dispatch: # run manually
  push:              # run on push to repo
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make ccache \
          curl git zip unzip python3

    - name: Download GCC 4.9 toolchain
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains
        curl -L https://codeberg.org/Karnak/aarch64-linux-android-4.9/archive/master.tar.gz \
          | tar -xz
        echo "PATH=$HOME/toolchains/bin:$PATH" >> $GITHUB_ENV

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CCACHE=ccache
        export PATH=$HOME/toolchains/bin:$PATH

        make exynos7880-a5y17lte_defconfig
        make -j$(nproc)

    - name: Prepare AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../AnyKernel3-flashable.zip *

    - name: Repack boot.img
      run: |
        mkdir boot_repack && cd boot_repack
        cp ../boot.img .
        curl -LO https://github.com/osm0sis/mkbootimg/archive/master.zip
        unzip master.zip
        cd mkbootimg-master
        # unpack
        python3 unpackbootimg.py --boot_img ../boot.img --out ./
        # replace kernel
        cp ../../arch/arm64/boot/Image.gz-dtb ./kernel
        # repack
        python3 mkbootimg.py --kernel ./kernel --ramdisk ./ramdisk.gz \
          --cmdline "$(cat ./cmdline)" --base $(cat ./base) \
          --pagesize $(cat ./pagesize) --os_version $(cat ./os_version) \
          --os_patch_level $(cat ./os_patch_level) \
          -o ../boot-repacked.img
        cd ../..

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          AnyKernel3-flashable.zip
          boot_repack/boot-repacked.img

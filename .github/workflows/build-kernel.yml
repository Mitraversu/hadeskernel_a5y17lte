name: Build Samsung Exynos7880 Kernel (A5 2017, Android 8, AOSP Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses5-dev git cpio gzip xz-utils python3

          # Make python point to python3
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1

      - name: Download AOSP Clang toolchain
        run: |
          mkdir -p ~/clang
          curl -L -k -o clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/clang-r383902.tar.gz
          tar -xzf clang.tar.gz -C ~/clang --strip-components=1

      - name: Patch defconfig
        run: |
          # Remove missing WireGuard module to avoid Kconfig error
          sed -i '/CONFIG_WIREGUARD/d' arch/arm64/configs/exynos7880-a5y17lte_eur_defconfig

      - name: Build kernel
        env:
          ARCH: arm64
          CLANG_PREFIX: ~/clang/bin/clang
          CROSS_COMPILE: ""
        run: |
          make exynos7880-a5y17lte_eur_defconfig
          # Enable KALLSYMS
          echo "CONFIG_KALLSYMS=y" >> .config
          echo "CONFIG_KALLSYMS_ALL=y" >> .config
          echo "CONFIG_KALLSYMS_BASE_RELATIVE=y" >> .config
          make -j$(nproc) CC=~/clang/bin/clang \
            CROSS_COMPILE= CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Repack boot.img
        run: |
          git clone https://github.com/topjohnwu/magiskboot --depth=1
          cd magiskboot
          make
          cd ..
          
          cp arch/arm64/boot/Image.gz-dtb ./kernel

          ./magiskboot/magiskboot unpack boot.img
          mv kernel ./kernel
          ./magiskboot/magiskboot repack boot.img new-boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: new-boot-img
          path: new-boot.img

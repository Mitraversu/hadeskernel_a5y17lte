name: Android Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make ccache \
          build-essential libelf-dev pkg-config git zip unzip python3

    - name: Download GCC 4.9 toolchain
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains
        git clone https://github.com/KudProject/aarch64-linux-android-4.9
        echo "PATH=$HOME/toolchains/aarch64-linux-android-4.9/bin:$PATH" >> $GITHUB_ENV

    - name: Compile WireGuard module (offline)
      run: |
        git clone https://git.zx2c4.com/wireguard-linux-compat
        git clone https://git.zx2c4.com/wireguard-tools
        # compile kernel module
        make -C wireguard-linux-compat/src -j$(nproc)
        # optional: install to module directory
        make -C wireguard-linux-compat/src INSTALL_MOD_PATH=$PWD/wireguard-modules install
        # compile wg tool
        make -C wireguard-tools/src -j$(nproc)
        make -C wireguard-tools/src INSTALL_MOD_PATH=$PWD/wireguard-tools install

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CCACHE=ccache
        export PATH=$HOME/toolchains/aarch64-linux-android-4.9/bin:$PATH

        make exynos7880-a5y17lte_defconfig
        make -j$(nproc)

    - name: Prepare AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../AnyKernel3-flashable.zip *

    - name: Repack boot.img
      run: |
        mkdir boot_repack && cd boot_repack
        cp ../boot.img .
        git clone https://github.com/osm0sis/mkbootimg.git
        cd mkbootimg
        python3 unpackbootimg.py --boot_img ../boot.img --out ./
        cp ../../arch/arm64/boot/Image.gz-dtb ./kernel
        python3 mkbootimg.py --kernel ./kernel --ramdisk ./ramdisk.gz \
          --cmdline "$(cat ./cmdline)" --base $(cat ./base) \
          --pagesize $(cat ./pagesize) \
          -o ../boot-repacked.img
        cd ../..

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          AnyKernel3-flashable.zip
          boot_repack/boot-repacked.img
          wireguard-modules
          wireguard-tools

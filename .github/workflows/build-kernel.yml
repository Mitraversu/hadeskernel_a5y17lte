name: Build Samsung Exynos7880 Kernel (A5 2017, Android 8, GCC 15.2.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout kernel source
      - name: Checkout kernel source
        uses: actions/checkout@v4

      # 2️⃣ Install build dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses5-dev git cpio gzip xz-utils python3 curl
          # Make python point to python3
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1

      # 3️⃣ Download and extract GCC 15.2.0
      - name: Download and extract GCC 15.2.0 toolchain
        run: |
          curl -L -k -o gcc-15.2.0.tar.gz https://ftp.mpi-inf.mpg.de/mirrors/gnu/mirror/gcc.gnu.org/pub/gcc/releases/gcc-15.2.0/gcc-15.2.0.tar.gz
          mkdir -p ~/gcc
          tar -xzf gcc-15.2.0.tar.gz -C ~/gcc --strip-components=1

      # 4️⃣ Patch defconfig to disable WireGuard
      - name: Disable WireGuard in defconfig
        run: |
          sed -i '/CONFIG_WIREGUARD/d' arch/arm64/configs/exynos7880-a5y17lte_eur_defconfig

      # 5️⃣ Build kernel with KALLSYMS enabled
      - name: Build kernel
        env:
          ARCH: arm64
        run: |
          make exynos7880-a5y17lte_eur_defconfig
          # Enable KALLSYMS
          echo "CONFIG_KALLSYMS=y" >> .config
          echo "CONFIG_KALLSYMS_ALL=y" >> .config
          echo "CONFIG_KALLSYMS_BASE_RELATIVE=y" >> .config
          make -j$(nproc) CC=~/gcc/bin/gcc CROSS_COMPILE=~/gcc/bin/aarch64-linux-android-

      # 6️⃣ Repack boot.img
      - name: Repack boot.img with Magiskboot
        run: |
          git clone https://github.com/topjohnwu/magiskboot --depth=1
          cd magiskboot
          make
          cd ..
          # Copy compiled kernel
          cp arch/arm64/boot/Image.gz-dtb ./kernel
          # Unpack stock boot.img and repack
          ./magiskboot/magiskboot unpack boot.img
          mv kernel ./kernel
          ./magiskboot/magiskboot repack boot.img new-boot.img

      # 7️⃣ Upload artifact
      - name: Upload new-boot.img
        uses: actions/upload-artifact@v4
        with:
          name: new-boot-img
          path: new-boot.img
